{% extends "base.html" %}
{% block content %}
<div class="auth-card">
  <h1>Log in</h1>
  <form method="POST">
    <label>Email
      <input type="email" name="email" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <p class="auth-switch">No account? Ask your admin to create one for you.</p>
</div>
{% endblock %}
