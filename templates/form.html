{% extends "base.html" %}
{% block content %}
<h1>{{ 'Edit Enquiry' if enquiry else 'Add Enquiry' }}</h1>
<form method="POST" class="stacked-form">
  <label>Customer name *
    <input type="text" name="customer_name" required value="{{ enquiry.customer_name if enquiry else '' }}">
  </label>
  <label>Phone *
    <input type="tel" name="phone" required value="{{ enquiry.phone if enquiry else '' }}">
  </label>
  <label>Company name
    <input type="text" name="company_name" value="{{ enquiry.company_name if enquiry else '' }}">
  </label>
  <label>Email
    <input type="email" name="email" value="{{ enquiry.email if enquiry else '' }}">
  </label>
  <label>Product category
    <input type="text" name="product_category" value="{{ enquiry.product_category if enquiry else '' }}" placeholder="e.g. PU Roller, PU Wheel, Sheet">
  </label>
  <label>Specs
    <textarea name="specs" rows="3">{{ enquiry.specs if enquiry else '' }}</textarea>
  </label>
  <div class="form-row">
    <label>Rate
      <input type="number" step="0.01" name="rate" value="{{ enquiry.rate if enquiry else '' }}">
    </label>
    <label>Rate unit
      <input type="text" name="rate_unit" value="{{ enquiry.rate_unit if enquiry else '' }}" placeholder="per piece / per kg">
    </label>
    <label>Quantity
      <input type="number" step="0.01" name="quantity" value="{{ enquiry.quantity if enquiry else 1 }}">
    </label>
  </div>
  <label>Delivery date
    <input type="date" name="delivery_date" value="{{ enquiry.delivery_date if enquiry else '' }}">
  </label>
  <label>Partner name (accountable) *
    <input type="text" name="partner_name" required value="{{ enquiry.partner_name if enquiry else current_user.name }}">
  </label>
  <button type="submit" class="btn btn-primary">{{ 'Save changes' if enquiry else 'Add Enquiry' }}</button>
</form>
{% endblock %}
