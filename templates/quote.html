{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h1>Quote - {{ enquiry.customer_name }}</h1>
  <a href="{{ url_for('enquiry_detail', eid=enquiry.id) }}" class="btn">Back</a>
</div>

<pre class="quote-box" id="quoteText">{{ quote_text }}</pre>

<div class="quote-actions">
  <button class="btn btn-primary" onclick="copyQuote()">Copy quote</button>
  <a class="btn" href="{{ whatsapp_url }}" target="_blank" rel="noopener">WhatsApp draft</a>
  <form method="POST" action="{{ url_for('enquiry_quote_email', eid=enquiry.id) }}" style="display:inline">
    <button type="submit" class="btn">Email quote</button>
  </form>
</div>

<p class="muted small">
  Total Rs. {{ total }} &middot; Advance Rs. {{ advance_amt }} &middot; Balance Rs. {{ balance_amt }}
</p>

<script>
function copyQuote() {
  const text = document.getElementById('quoteText').innerText;
  navigator.clipboard.writeText(text).then(function() {
    alert('Quote copied to clipboard');
  });
}
</script>
{% endblock %}
